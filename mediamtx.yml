# ============================================================
# MediaMTX 설정 파일 (v1.x 포맷)
# 접속 URL: rtsp://JETSON_IP:8554/stream
# ============================================================

logLevel: info
logDestinations: [stdout]

# RTSP 포트 (기본값이 8554라 생략 가능하지만 명시)
rtspAddress: :8554

paths:
  stream:
    runOnInit: /app/stream.sh
    runOnInitRestart: yes
