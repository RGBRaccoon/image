# ============================================================
# MediaMTX 설정 파일
# ============================================================
#
# 역할: RTSP 서버를 열고, GStreamer 파이프라인을 자동 실행해서
#       카메라 영상을 받아 클라이언트에게 서빙함.
#
# 접속 URL: rtsp://JETSON_IP:8554/stream
# ============================================================

logLevel: info
logDestinations: [stdout]

# RTSP 서버 주소 및 포트
rtsp:
  address: :8554

# ============================================================
# 스트림 경로 설정
# ============================================================
paths:
  stream:
    # MediaMTX 시작 시 stream.sh 자동 실행
    # stream.sh 안의 GStreamer 파이프라인이 영상을 이 서버로 push함
    runOnInit: /app/stream.sh

    # stream.sh가 예기치 않게 종료되면 자동으로 재시작
    runOnInitRestart: yes
